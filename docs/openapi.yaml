      description: |
        使用所属主号已保存的受信任 Apple Web 会话读取完整 Hide My Email 目录，并按本地地址
        定位远端条目。远端条目仍启用时，服务先调用 Apple `/v1/hme/deactivate` 停止转发，
        再调用 `/v1/hme/delete` 永久删除；已经停用的条目直接永久删除。

        Apple 完整目录中已经没有该地址时按幂等成功处理。远端变更返回错误或结果不明确时，
        服务只通过 `/v2/hme/list` 重新读取权威目录进行对账；确认地址已经不存在后，才删除本地
        隐私邮箱及其 API Key、邮件快照和关联记录。任何错误响应都会保留本地隐私邮箱记录，
        调用方可使用同一 ID 安全重试。若远端删除已经完成，但 Apple 会话状态保存或本地清理失败，
        本接口返回 500；重试时会通过“远端目录已缺失”的幂等分支完成本地清理。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAliasID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "204":
          description: Apple 端永久删除已经确认或远端本就不存在；本地隐私邮箱及关联记录已清除
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
        "400":
          description: id 不是正整数
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppleErrorResponse"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: id 参数无效
                  request_id: 6oe7j0x3x3pJv9Dv
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "404":
          $ref: "#/components/responses/AdminAliasNotFound"
        "409":
          $ref: "#/components/responses/AdminAliasDeleteConflict"
        "429":
          $ref: "#/components/responses/AdminAppleRateLimited"
        "500":
          $ref: "#/components/responses/AdminAliasDeleteInternalError"
        "502":
          $ref: "#/components/responses/AdminAppleBadGateway"
        "503":
          $ref: "#/components/responses/AdminAppleUnavailable"
        "504":
          $ref: "#/components/responses/AdminAppleTimeout"

  /admin/api/v1/logs:
    get:
      tags:
        - Admin Logs
      operationId: listAdminApplicationLogs
      summary: 查询当前进程应用日志
      description: |
        返回当前应用进程环形缓冲区中保留的最近最多 2000 条日志，按 `id` 从新到旧排列。
        环形缓冲区还受总字节数限制，较大的记录可能使更早日志在达到 2000 条前被覆盖。
        可按级别、关键词、主号、`sync_run_id` 和 `auto_create_run_id` 筛选，并使用排他的
        `before_id` 游标向更早的记录翻页。

        邮件同步流程为每次逻辑同步分配一个 `sync_run_id`；同一次追平任务的多个批次继续使用同一值。
        每个被任务认领的自动创建计划槽分配一个 `auto_create_run_id`。两个运行标识都按结构化字段
        完整值精确匹配，前端据此读取当前环形窗口内同一轮流程的全部分页，再按时间从早到晚组成
        详情时间线。日志不会跨进程重启保留，较早流程事件也可能已被覆盖，因此时间线可能只包含
        部分流程，不属于持久审计记录。隐私邮箱地址、原始 API Key、Apple 会话、Cookie、令牌和
        凭据等敏感内容不会写入流程日志，其他敏感字段会在进入日志缓冲区前脱敏。
      security:
        - adminSession: []
      parameters:
        - name: level
          in: query
          required: false
          description: 日志级别；省略时返回全部级别。
          schema:
            type: string
            enum:
              - debug
              - info
              - warn
              - error
        - name: query
          in: query
          required: false
          description: 用于匹配日志内容的关键词；前后空白会被忽略。
          schema:
            type: string
            maxLength: 200
        - name: account_id
          in: query
          required: false
          description: 只返回带有指定主号 ID 的日志。
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: sync_run_id
          in: query
          required: false
          description: |
            邮件同步运行标识的精确筛选值。参数出现时会忽略前后空白，之后必须包含 1 至 128 个字符，
            且只能使用 ASCII 字母、数字、连字符、下划线、句点和冒号。服务生成的值通常采用
            `sync-<16位十六进制时间>-<至少8位十六进制序号>` 格式。
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9_.:-]+$"
          example: sync-1875f21a4c8b0000-00000001
        - name: auto_create_run_id
          in: query
          required: false
          description: |
            自动创建计划槽运行标识的精确筛选值。校验规则与 `sync_run_id` 相同：参数出现时会忽略
            前后空白，之后必须包含 1 至 128 个字符，且只能使用 ASCII 字母、数字、连字符、下划线、
            句点和冒号。服务生成的值通常采用
            `auto-create-<16位十六进制时间>-<至少8位十六进制序号>` 格式。
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9_.:-]+$"
          example: auto-create-1875f21a4c8b0000-00000001
        - name: limit
          in: query
          required: false
          description: 本页最多返回的日志数。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: before_id
          in: query
          required: false
          description: 排他游标，只返回 ID 小于该值的日志。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 当前筛选条件下的一页应用日志
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationLogListResponse"
        "400":
          description: level、query、account_id、sync_run_id、auto_create_run_id、limit 或 before_id 参数无效
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppleErrorResponse"
              example:
                error:
                  code: VALIDATION_FAILED
                  message: level 参数无效
                  request_id: 6oe7j0x3x3pJv9Dv
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"

  /healthz:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: 检查服务及数据库是否可用
      security: []
      responses:
        "200":
          description: 服务与数据库连接正常
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "503":
          description: 数据库当前不可用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: DATABASE_UNAVAILABLE
                  message: 数据库不可用
                  request_id: 6oe7j0x3x3pJv9Dv

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: icloud_admin_session
      description: |
        后台登录后设置的 HttpOnly、SameSite=Strict 会话 Cookie。所有管理端写操作还必须发送
        当前会话返回的 `X-CSRF-Token`，并通过服务端同源校验。此 Cookie 与 Apple Web 会话无关。

    externalOAuthToken:
      type: http
      scheme: bearer
      bearerFormat: opaque OAuth token
      description: |
        `POST /api/v1/aliases` 专用的服务级 Bearer 令牌，通过环境变量
        `ICLOUD_API_OAUTH_TOKEN` 配置，长度为 32 至 4096 个字符且不得包含空白。调用时发送
        `Authorization: Bearer <ICLOUD_API_OAUTH_TOKEN>`。该令牌不同于隐私邮箱自己的
        `icm_` 邮件 API Key，不应写入 URL、日志或普通配置文件，也不得与其他凭据复用。

    aliasApiKey:
      type: http
      scheme: bearer
      bearerFormat: icm_ + 43 位规范 Raw Base64URL
      x-token-pattern: "^icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: |
        后台为单个隐私邮箱生成的独立 Key。完整值固定为 47 个 ASCII 字符：
        小写前缀 `icm_` 加 43 位无 `=` 填充的规范 Raw Base64URL，严格解码后为 32 字节。
        精确格式正则为 `^icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$`；最后一位的
        受限字符集保证末尾填充位为零。服务端还会执行严格 Base64URL 解码和长度检查。
        `icm_REPLACE_WITH_ALIAS_KEY` 仅为说明性占位值，其格式故意无效，直接发送会返回 401。

    aliasApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      x-token-pattern: "^icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: |
        `/api/v1/mail/recent` 使用的查询参数凭据，格式和 `aliasApiKey` 完全相同。
        可以使用隐私邮箱的原始 API Key，也可以使用管理端操作列复制的派生直达凭据。
        派生凭据由服务端主密钥签名、不写入数据库、只对当前 API Key 状态有效，
        不能用于 Bearer 接口；轮换隐私邮箱 API Key 会使此前复制的派生凭据失效。
        `/api/v1/mail/recent` 是具有副作用的 `GET`，会按 `(UIDVALIDITY, UID)` 一次性消费
        当前最新邮件并异步设置主号全局 `\Seen`。成功消费后链接本身仍然有效；当前 UID 的
        后续请求返回 404，新 UID 到来后同一链接可再次消费。消费事务在响应写出前提交，
        客户端断线或超时也可能已经消费邮件。浏览器预取、链接预览和安全扫描器可能提前
        触发这些副作用；应优先使用可重复读取且不触发消费的 `/api/v1/mail/latest`。
        查询参数会进入浏览器历史，并可能被代理或外围监控记录、通过 Referer 泄露。
        本应用内置 HTTP 日志不记录查询字符串，但外围日志仍须删除或脱敏查询参数。
        完整 URL 必须按密钥保护，并且只能通过 HTTPS 使用。
        泄露链接即使当前返回 404，仍可消费未来新邮件；泄露后应立即轮换 Key。

  parameters:
    AdminAccountID:
      name: id
      in: path
      required: true
      description: 本地 iCloud 主号 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminAliasID:
      name: id
      in: path
      required: true
      description: 本地隐私邮箱 ID。
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminCSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: 当前后台登录会话返回的 CSRF Token；请求还必须通过同源校验。
      schema:
        type: string
        minLength: 1

  headers:
    RequestID:
      description: 服务端生成的请求追踪标识；错误响应体中的 request_id 与此值一致。
      schema:
        type: string
      example: 6oe7j0x3x3pJv9Dv
    NoStore:
      description: 禁止客户端及中间缓存保存响应。
      schema:
        type: string
        const: no-store
      example: no-store
    AdminNoStore:
      description: 禁止保存包含后台状态或一次性凭据的响应。
      schema:
        type: string
        const: no-store, private
      example: no-store, private

  responses:
    AdminAliasNotFound:
      description: 指定的本地隐私邮箱不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: 隐私邮箱不存在
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAliasDeleteConflict:
      description: |
        尚未连接 Apple 账户、Apple 会话已过期、Apple 账户需要先完成条款或其他操作、
        Apple 登录账户或转发邮箱与主号不匹配、操作期间主号身份发生变化，或该隐私邮箱
        仍在等待 Apple 目录确认。远端和本地删除均未确认完成，本地记录保留。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            appleLoginRequired:
              value:
                error:
                  code: APPLE_LOGIN_REQUIRED
                  message: 请先连接 Apple 账户
                  request_id: 6oe7j0x3x3pJv9Dv
            appleSessionExpired:
              value:
                error:
                  code: APPLE_SESSION_EXPIRED
                  message: Apple 会话已过期，请重新登录
                  request_id: 6oe7j0x3x3pJv9Dv
            appleAccountActionRequired:
              value:
                error:
                  code: APPLE_ACCOUNT_ACTION_REQUIRED
                  message: Apple 账户需要完成条款确认或其他账户操作，请前往 Apple 官网处理后重试
                  request_id: 6oe7j0x3x3pJv9Dv
            appleAccountMismatch:
              value:
                error:
                  code: APPLE_ACCOUNT_MISMATCH
                  message: Apple 登录账户或转发邮箱与该主号不匹配
                  request_id: 6oe7j0x3x3pJv9Dv
            accountChanged:
              value:
                error:
                  code: ACCOUNT_CHANGED
                  message: 主号信息已发生变化，请重新操作
                  request_id: 6oe7j0x3x3pJv9Dv
            aliasConfirmationPending:
              value:
                error:
                  code: ALIAS_CONFIRMATION_PENDING
                  message: 该隐私邮箱正在等待 Apple 目录确认，暂时不能修改或删除
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminAliasDeleteInternalError:
      description: |
        Apple 会话状态保存或本地清理失败，本地隐私邮箱记录保留。Apple 端永久删除可能已经完成；
        使用同一隐私邮箱 ID 重试是安全的，服务会重新读取 Apple 完整目录并完成剩余的本地清理。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: 请求处理失败，请稍后重试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleBadRequest:
      description: JSON 格式错误、含有未知字段，或 Apple 登录/验证码字段校验失败
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            invalidJSON:
              value:
                error:
                  code: INVALID_JSON
                  message: JSON 请求体格式错误或包含未知字段
                  request_id: 6oe7j0x3x3pJv9Dv
            validationFailed:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: 请求字段校验失败
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminAuthUnauthorized:
      description: 后台会话 Cookie 缺失、无效或已经过期
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            loginRequired:
              value:
                error:
                  code: AUTH_REQUIRED
                  message: 请先登录
                  request_id: 6oe7j0x3x3pJv9Dv
            sessionExpired:
              value:
                error:
                  code: SESSION_EXPIRED
                  message: 登录会话已过期
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminCSRFForbidden:
      description: X-CSRF-Token 缺失、无效，或请求未通过同源校验
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: CSRF_INVALID
              message: 请求校验失败，请刷新页面后重试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountNotFound:
      description: 指定的本地主号不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: 主号不存在
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountDisabled:
      description: 主号已停用，必须先启用后才能同步邮件
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: ACCOUNT_DISABLED
              message: 主号已停用，请先启用主号后再同步邮件
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleConflict:
      description: |
        尚未连接 Apple 账户、Apple 会话已经过期、转发邮箱与主号不匹配、操作期间主号身份变化，
        或目录中的地址已登记到其他主号。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            appleLoginRequired:
              value:
                error:
                  code: APPLE_LOGIN_REQUIRED
                  message: 请先连接 Apple 账户
                  request_id: 6oe7j0x3x3pJv9Dv
            appleSessionExpired:
              value:
                error:
                  code: APPLE_SESSION_EXPIRED
                  message: Apple 会话已过期，请重新登录
                  request_id: 6oe7j0x3x3pJv9Dv
            appleAccountMismatch:
              value:
                error:
                  code: APPLE_ACCOUNT_MISMATCH
                  message: Apple 登录账户或转发邮箱与该主号不匹配
                  request_id: 6oe7j0x3x3pJv9Dv
            aliasOwnershipConflict:
              value:
                error:
                  code: ALIAS_OWNERSHIP_CONFLICT
                  message: 隐私邮箱已属于其他主号
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleFlowExpired:
      description: 验证码挑战已过期、已失效或不属于当前后台会话与主号
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: APPLE_FLOW_EXPIRED
              message: 验证流程已过期，请重新登录
              request_id: 6oe7j0x3x3pJv9Dv

    AdminJSONTooLarge:
      description: JSON 请求体超过 64 KiB
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: JSON 请求体不能超过 64 KiB
              request_id: 6oe7j0x3x3pJv9Dv

    AdminUnsupportedMediaType:
      description: 请求正文的 Content-Type 不是 application/json
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 请求必须使用 application/json
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleRejected:
      description: Apple ID 或账户密码错误，或双重认证验证码错误
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            credentialsInvalid:
              value:
                error:
                  code: APPLE_CREDENTIALS_INVALID
                  message: Apple ID 或密码不正确
                  request_id: 6oe7j0x3x3pJv9Dv
            verificationInvalid:
              value:
                error:
                  code: APPLE_VERIFICATION_INVALID
                  message: 验证码不正确，请重新输入
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleRateLimited:
      description: Apple 服务对当前账户或会话限流
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: APPLE_RATE_LIMITED
              message: Apple 请求过于频繁，请稍后再试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminInternalError:
      description: 本地数据库、加密或一次性 Key 生成操作失败
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: 请求处理失败，请稍后重试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminSyncBadGateway:
      description: 主号 IMAP 同步失败，当前批次未成功完成；实际同步默认预算为取得主号锁和全局连接额度后的 10m，单条 IMAP 命令默认超时仍为 25s
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: SYNC_FAILED
              message: 同步失败，请检查连接状态
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleBadGateway:
      description: Apple 上游服务返回异常响应
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: APPLE_UPSTREAM_ERROR
              message: Apple 服务暂时异常，请稍后再试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleUnavailable:
      description: Apple 隐私邮箱服务尚未初始化；本次操作未完成，本地记录保持不变
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Apple 同步服务暂时不可用，请稍后再试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAutoCreationUnavailable:
      description: 隐私邮箱自动创建服务尚未初始化
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: AUTO_CREATION_UNAVAILABLE
              message: 自动创建服务暂不可用
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAppleTimeout:
      description: Apple 上游服务响应超时
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: APPLE_UPSTREAM_ERROR
              message: Apple 服务响应超时，请稍后再试
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasBadRequest:
      description: |
        请求字段缺失、为空、格式错误、重复出现在查询串或正文中、包含未知字段，
        或隐私邮箱与已登记主号邮箱/所选主号 IMAP 用户名相同。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_REQUEST
              message: 请求参数无效
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasUnauthorized:
      description: Authorization Header 缺失、格式错误或 OAuth Bearer 令牌无效
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        WWW-Authenticate:
          description: 本接口要求 Bearer 鉴权。
          schema:
            type: string
            const: Bearer
          example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_OAUTH_TOKEN
              message: OAuth 令牌无效
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasAccountNotFound:
      description: "`icloud` 指定的主号不存在"
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ACCOUNT_NOT_FOUND
              message: iCloud 主号不存在
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasConflict:
      description: 隐私邮箱已经登记，或指定主号已达到启用隐私邮箱数量上限
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            aliasExists:
              summary: 隐私邮箱已经登记
              value:
                error:
                  code: ALIAS_EXISTS
                  message: 隐私邮箱已存在
                  request_id: 6oe7j0x3x3pJv9Dv
            aliasLimitReached:
              summary: 主号达到隐私邮箱数量上限
              value:
                error:
                  code: ALIAS_LIMIT_REACHED
                  message: 主号的隐私邮箱数量已达上限
                  request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasRequestTooLarge:
      description: URL 查询串与表单正文的编码参数合计超过 4 KiB
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: 请求体过大
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasUnsupportedMediaType:
      description: 请求含有正文，但 Content-Type 不是 application/x-www-form-urlencoded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 仅支持 application/x-www-form-urlencoded
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasRateLimited:
      description: 当前调用方在限流窗口内请求过多
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: RATE_LIMITED
              message: 请求过于频繁
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasInternalError:
      description: 生成邮件 API Key 或派生直达凭据时发生内部错误
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: 服务内部错误
              request_id: 6oe7j0x3x3pJv9Dv

    CreateAliasUnavailable:
      description: 查询主号或登记隐私邮箱时数据库暂不可用
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: DATABASE_UNAVAILABLE
              message: 数据库暂不可用
              request_id: 6oe7j0x3x3pJv9Dv

  schemas:
    AdminAppleAuthRequest:
      type: object
      additionalProperties: false
      required:
        - apple_id
        - password
      properties:
        apple_id:
          type: string
          minLength: 1
          maxLength: 320
          description: 用于建立受信任 Web 会话的 Apple ID。
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: |
            Apple 账户密码，不是 App 专用密码。只在本次登录请求中使用，不写入数据库、响应或日志。
        region:
          type: string
          enum:
            - global
            - cn
          default: global
          description: Apple 服务区域；global 为全球区，cn 为中国大陆区。

    AdminAppleVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Apple 登录返回的短期验证码挑战标识。
        code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
          description: 6 位双重认证验证码；只在本次验证请求中使用，不写入数据库。

    AdminAppleAuthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAppleAuthResult"

    AdminAppleAuthResult:
      type: object
      additionalProperties: false
      required:
        - status
        - apple_session
      properties:
        status:
          type: string
          enum:
            - verification_required
            - authenticated
        challenge_id:
          type: string
          description: 仅在 status=verification_required 时返回；提交验证码时原样带回。
        apple_session:
          $ref: "#/components/schemas/AdminAppleSession"

    AdminAppleSession:
      type: object
      additionalProperties: false
      required:
        - status
        - apple_id
        - region
        - authenticated_at
        - expires_at
      properties:
        status:
          type: string
          enum:
            - login_required
            - verification_required
            - authenticated
            - expired
          description: |
            login_required 表示尚无会话；verification_required 表示正在等待验证码；
            authenticated 表示可同步目录；expired 表示需要重新登录。
        apple_id:
          type: string
          description: 连接的 Apple ID；尚无会话时为空字符串。
        region:
          type: string
          enum:
            - ""
            - global
            - cn
          description: Apple 服务区域；尚无会话时为空字符串。
        authenticated_at:
          type:
            - string
            - "null"
          format: date-time
          description: 受信任会话认证完成的 UTC 时间；未完成登录时为 null。
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 已知的会话或验证码挑战到期时间；上游未提供时为 null。

    AdminAccountDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccountDetail"

    AdminAccountDetail:
      type: object
      additionalProperties: false
      required:
        - account
        - aliases
        - apple_session
        - auto_creation
      properties:
        account:
          $ref: "#/components/schemas/AdminAccount"
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/AdminAlias"
        apple_session:
          description: |
            该主号的 Apple Web 会话状态。正常启用目录同步服务时返回对象；
            服务未初始化的降级场景为 null。Apple 账户密码、验证码和加密会话正文不会返回。
          oneOf:
            - $ref: "#/components/schemas/AdminAppleSession"
            - type: "null"
        auto_creation:
          $ref: "#/components/schemas/AdminAliasAutoCreation"
        sync_pending:
          type: boolean
          description: |
            仅在手动邮件同步返回 202 时出现且恒为 true，表示请求已进入后台队列，
            或同一主号已有同步任务正在处理。

    AdminAliasAutoCreationRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: 是否开启该主号每小时 5 次的自动创建计划。

    AdminAutoCreationResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAliasAutoCreation"

    AdminAliasAutoCreation:
      type: object
      additionalProperties: false
      required:
        - enabled
        - status
        - planned_at
        - planned_times
        - next_run_at
        - last_attempted_at
        - last_created_at
        - last_alias_address
        - last_error
        - pending_key_count
        - pending_auto_created_key_count
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
            - disabled
            - scheduled
            - paused
            - login_required
            - error
          description: 当前计划状态；login_required 表示需重新登录 Apple，会话失效不会自动关闭开关。
        planned_at:
          type:
            - string
            - "null"
          format: date-time
          description: 当前剩余计划的第一个时间点；没有剩余计划时为 null。
        planned_times:
          type: array
          items:
            type: string
            format: date-time
          description: 当前剩余计划的全部 UTC 时间点，最多 5 个。
        next_run_at:
          type:
            - string
            - "null"
          format: date-time
        last_attempted_at:
          type:
            - string
            - "null"
          format: date-time
        last_created_at:
          type:
            - string
            - "null"
          format: date-time
        last_alias_address:
          type: string
        last_error:
          type: string
          description: 最近一次尝试的截断错误信息；不会包含原始 API Key 或 Apple 会话材料。
        pending_key_count:
          type: integer
          minimum: 0
        pending_auto_created_key_count:
          type: integer
          minimum: 0

    AdminPendingAliasKeysRequest:
      type: object
      additionalProperties: false
      required:
        - alias_ids
      properties:
        alias_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: integer
            format: int64
            minimum: 1

    AdminPendingAliasKeysResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - created
          properties:
            created:
              type: array
              items:
                $ref: "#/components/schemas/AdminAppleCreatedAlias"

    AdminApplicationLogListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminApplicationLogPage"

    AdminApplicationLogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - has_more
        - next_before_id
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminApplicationLog"
        has_more:
          type: boolean
          description: 是否还有符合当前筛选条件的更早日志。
        next_before_id:
          type: integer
          minimum: 0
          description: 下一页请求使用的 before_id；没有下一页时为 0。

    AdminApplicationLog:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - level
        - message
        - source
        - attributes
      properties:
        id:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        level:
          type: string
          enum:
            - debug
            - info
            - warn
            - error
        message:
          type: string
        source:
          type: string
        attributes:
          $ref: "#/components/schemas/AdminApplicationLogAttributes"
        account_id:
          type: integer
          format: int64
          minimum: 1
          description: 日志可归属到主号时返回。
        request_id:
          type: string
          description: 日志可关联到 HTTP 请求时返回。
        sync_run_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: |
            日志属于邮件同步流程时返回；非同步日志省略。该值也保留在 attributes 中，
            同一次逻辑同步的多个追平批次共用同一值。
        auto_create_run_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: |
            日志属于自动创建流程时返回；其他日志省略。该值也保留在 attributes 中，
            每个被任务认领的计划槽使用一个独立值。

    AdminApplicationLogAttributes:
      type: object
      description: |
        已脱敏的结构化日志属性，所有值均编码为字符串。普通日志可以包含其他字符串属性；
        邮件同步和自动创建流程使用下列标准字段构建详情时间线。隐私邮箱地址、原始 API Key、
        Apple 会话、Cookie、令牌和凭据等敏感内容不会写入这些流程属性。
      properties:
        account_id:
          type: string
          pattern: "^[1-9][0-9]*$"
        request_id:
          type: string
        sync_run_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: 一次逻辑邮件同步的聚合标识。
        auto_create_run_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.:-]+$"
          description: 一个已认领自动创建计划槽的聚合标识。
        auto_create_stage:
          type: string
          description: 当前自动创建阶段；终态分别使用 completed、failed 或 cancelled。
          enum:
            - preparing
            - checking_account
            - checking_capacity
            - loading_session
            - validating_session
            - checking_forwarding
            - initializing_forwarding
            - preparing_key
            - reserving
            - saving_candidate
            - confirming
            - reconciling
            - saving_result
            - completed
            - failed
            - cancelled
        auto_create_percent:
          type: string
          pattern: "^(100|[1-9]?[0-9])$"
          description: 当前自动创建进度百分比，范围 0 至 100。
        auto_create_event:
          type: string
          description: 当前自动创建流程事件，用于区分开始、阶段变化和各类终态或状态写入异常。
          enum:
            - run_started
            - stage_started
            - run_completed
            - run_completed_with_warning
            - run_failed
            - run_cancelled
            - state_persist_failed
        trigger:
          type: string
          enum:
            - manual
            - automatic
        sync_batch:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: 当前追平批次，从 1 开始。
        sync_stage:
          type: string
          enum:
            - queued
            - waiting
            - preparing
            - connecting
            - authenticating
            - scanning
            - reading
            - validating
            - saving
            - completed
            - failed
            - cancelled
        sync_percent:
          type: string
          pattern: "^(100|[1-9]?[0-9])$"
          description: 当前进度百分比，范围 0 至 100。
        sync_event:
          type: string
          enum:
            - run_queued
            - waiting
            - run_started
            - batch_started
            - account_loaded
            - prepared
            - stage_started
            - batch_saved
            - batch_completed
            - run_completed
            - run_failed
            - run_cancelled
        elapsed_ms:
          type: string
          pattern: "^[0-9]+$"
          description: 从当前邮件同步或自动创建流程开始到本事件的累计毫秒数。
        batch_elapsed_ms:
          type: string
          pattern: "^[0-9]+$"
          description: 从当前批次开始到当前事件的毫秒数；批次尚未开始时省略。
        failed_stage:
          type: string
          description: 邮件同步或自动创建失败、取消前正在执行的阶段，仅终止事件使用。
        failed_operation:
          type: string
          description: 失败或取消时对应的内部操作位置；自动创建结果状态写入异常时也会返回。
        error_code:
          type: string
          description: 自动创建失败、取消或结果状态写入异常的稳定诊断代码。
        error_class:
          type: string
          description: 自动创建失败、取消或结果状态写入异常所属的诊断类别。
        cause_category:
          type: string
          description: 受控的直接原因分类，不包含底层错误原文或敏感值。
          enum:
            - account_state
            - apple_upstream
            - capacity
            - context
            - crypto
            - internal
            - persistence
            - plan_conflict
            - schedule
            - session
        error_context:
          type: string
          description: |
            不含邮箱地址、Key、Apple 会话或凭据等敏感值的错误说明；用于流程终止事件，
            以及自动创建结果状态写入异常事件。
        http_status:
          type: string
          pattern: "^[1-5][0-9]{2}$"
          description: Apple 上游返回的 HTTP 状态；失败不涉及 HTTP 响应时省略。
        retryable:
          type: string
          enum:
            - "true"
            - "false"
          description: Apple 上游错误是否标记为可重试；不涉及上游错误时省略。
        upstream_retryable:
          type: string
          enum:
            - "true"
            - "false"
          description: 与 retryable 相同的 Apple 上游重试标记，供日志消费者显式区分。
        schedule_action:
          type: string
          enum:
            - continue
            - disabled
            - none
          description: 本计划槽结束后继续运行、关闭自动创建或没有后续动作。
        next_run_at:
          type: string
          format: date-time
          description: 自动创建计划的下次运行时间；没有后续计划时省略。
        scheduled_for:
          type: string
          format: date-time
          description: 当前自动创建计划槽原定的运行时间。
        attempted_at:
          type: string
          format: date-time
          description: 当前计划槽实际被认领并开始执行的时间。
        remote_side_effect_possible:
          type: string
          enum:
            - "true"
            - "false"
          description: 失败或取消前是否已进入可能在 Apple 侧修改默认转发设置或创建地址的阶段。
        pending_confirmation:
          type: string
          enum:
            - "true"
            - "false"
          description: 本地是否已保存待确认候选，后续计划会优先对账而不会重复创建。
        failure_state_recorded:
          type: string
          enum:
            - "true"
            - "false"
          description: 本次失败的受控摘要是否已写入自动创建计划状态。
        auto_creation_disabled:
          type: string
          enum:
            - "true"
            - "false"
          description: 本次失败后是否已关闭该主号的自动创建计划。
        result_state_recorded:
          type: string
          enum:
            - "true"
            - "false"
          description: 创建完成后成功结果是否已写入自动创建计划状态。
        operation:
          type: string
          description: 受控白名单中的 Apple 操作名称；无法识别时为 unknown。
        service_code_present:
          type: string
          enum:
            - "true"
            - "false"
          description: Apple 响应是否带服务码；原始服务码不会写入日志。
        service_code_fingerprint:
          type: string
          pattern: "^[a-f0-9]{16}$"
          description: 原始 Apple 服务码的不可逆短指纹，仅用于聚合同类失败。
        confirmation_attempt:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: 当前只读目录确认或对账的尝试次数。
        error:
          type: string
          description: 已脱敏的详细错误文本；用于流程终止或自动创建结果状态写入异常事件。
      additionalProperties:
        type: string

    AdminAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - imap_host
        - imap_port
        - imap_username
        - enabled
        - last_sync_status
        - last_sync_error
        - last_sync_error_log
        - last_synced_at
        - created_at
        - updated_at
        - alias_count
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        imap_host:
          type: string
          description: 邮件同步固定使用 imap.mail.me.com。
        imap_port:
          type: integer
          description: 邮件同步固定使用 993/TLS。
        imap_username:
          type: string
        enabled:
          type: boolean
        last_sync_status:
          type: string
        last_sync_error:
          type: string
          description: 最近同步错误的简短摘要；最近一次同步没有错误时为空字符串。
        last_sync_error_log:
          type: string
          description: 最近同步错误的完整日志；最近一次同步没有错误时为空字符串。
        last_synced_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        alias_count:
          type: integer
          minimum: 0
        sync_progress:
          $ref: "#/components/schemas/AdminSyncProgress"

    AdminSyncProgress:
      type: object
      additionalProperties: false
      required:
        - active
        - source
        - stage
        - percentage
        - started_at
        - updated_at
      properties:
        active:
          type: boolean
          const: true
          description: 该对象出现时恒为 true；同步结束后整个 sync_progress 字段省略。
        source:
          type: string
          enum:
            - manual
            - automatic
          description: 本次同步由管理员手动发起，或由定时任务自动发起。
        stage:
          type: string
          enum:
            - queued
            - waiting
            - preparing
            - connecting
            - authenticating
            - scanning
            - reading
            - validating
            - saving
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminAlias:
      type: object
      additionalProperties: false
      required:
        - id
        - account_id
        - account_email
        - address
        - label
        - api_key_prefix
        - direct_link_path
        - enabled
        - last_sync_status
        - last_sync_error
        - last_sync_error_log
        - last_synced_at
        - last_accessed_at
        - latest_received_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        account_id:
          type: integer
          format: int64
          minimum: 1
        account_email:
          type: string
          format: email
        address:
          type: string
          format: email
        label:
          type: string
        api_key_prefix:
          type: string
          description: 用于辨认 Key 的非完整前缀。
        direct_link_path:
          type: string
          format: uri-reference
          pattern: "^(|/api/v1/mail/recent\\?api_key=icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048])$"
          description: 使用派生凭据、按当前邮件一次性消费的同源收件直达路径，不含原始 API Key；成功访问会消费当前 UID 并异步标记主号邮件为已读，链接本身仍可等待后续未消费的新 UID；派生链接生成失败时为空字符串。
        enabled:
          type: boolean
        last_sync_status:
          type: string
        last_sync_error:
          type: string
          description: 最近同步错误的简短摘要；最近一次同步没有错误时为空字符串。
        last_sync_error_log:
          type: string
          description: 最近同步错误的完整日志；最近一次同步没有错误时为空字符串。
        last_synced_at:
          type:
            - string
            - "null"
          format: date-time
        last_accessed_at:
          type:
            - string
            - "null"
          format: date-time
        latest_received_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminAppleSyncResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAppleSyncResult"

    AdminAppleSyncResult:
      type: object
      additionalProperties: false
      required:
        - account
        - aliases
        - apple_session
        - auto_creation
        - summary
        - created
      properties:
        account:
          $ref: "#/components/schemas/AdminAccount"
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/AdminAlias"
        apple_session:
          $ref: "#/components/schemas/AdminAppleSession"
        auto_creation:
          $ref: "#/components/schemas/AdminAliasAutoCreation"
        summary:
          $ref: "#/components/schemas/AdminAppleSyncSummary"
        created:
          type: array
          description: |
            本次新建地址及其一次性凭据。已有地址不出现在此数组中；原始 API Key 离开响应后不可恢复。
          items:
            $ref: "#/components/schemas/AdminAppleCreatedAlias"

    AdminAppleSyncSummary:
      type: object
      additionalProperties: false
      required:
        - total
        - created_count
        - existing_count
        - inactive_count
        - imported_disabled_count
        - conflict_count
        - filtered_out_count
      properties:
        total:
          type: integer
          minimum: 0
          description: forwardToEmail 与当前主号匹配的目录条目数。
        created_count:
          type: integer
          minimum: 0
        existing_count:
          type: integer
          minimum: 0
        inactive_count:
          type: integer
          minimum: 0
          description: 匹配条目中 Apple 标记为 inactive 的数量。
        imported_disabled_count:
          type: integer
          minimum: 0
          description: 因超出本地 1000 个启用地址容量而以 disabled 状态新建的 active 地址数量；Apple inactive 数量单独由 inactive_count 表示。
        conflict_count:
          type: integer
          minimum: 0
        filtered_out_count:
          type: integer
          minimum: 0
          description: 因 forwardToEmail 不匹配当前主号而跳过的目录条目数。

    AdminAppleCreatedAlias:
      type: object
      additionalProperties: false
      required:
        - alias
        - api_key
        - mail_api_direct_link
      properties:
        alias:
          $ref: "#/components/schemas/AdminAlias"
        api_key:
          type: string
          pattern: "^icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: 新导入或自动创建地址的原始邮件 API Key；仅在本次受保护响应中显示，自动创建 Key 还需按 alias ID 确认保存后才会从待领取队列删除。
        mail_api_direct_link:
          type: string
          format: uri-reference
          pattern: "^(|/api/v1/mail/recent\\?api_key=icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048])$"
          description: 使用派生凭据、按当前邮件一次性消费的同源收件直达路径，不含 api_key 字段中的原始 Key；成功访问会消费当前 UID 并异步标记主号邮件为已读，链接本身仍可等待后续未消费的新 UID；派生失败时为空字符串。

    AdminAppleErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/AdminAppleError"

    AdminAppleError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - SESSION_EXPIRED
            - CSRF_INVALID
            - NOT_FOUND
            - INVALID_JSON
            - VALIDATION_FAILED
            - REQUEST_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - APPLE_LOGIN_REQUIRED
            - APPLE_SESSION_EXPIRED
            - APPLE_CREDENTIALS_INVALID
            - APPLE_VERIFICATION_INVALID
            - APPLE_FLOW_EXPIRED
            - APPLE_ACCOUNT_ACTION_REQUIRED
            - APPLE_RATE_LIMITED
            - APPLE_UPSTREAM_ERROR
            - AUTO_CREATION_UNAVAILABLE
            - ACCOUNT_DISABLED
            - APPLE_ACCOUNT_MISMATCH
            - ACCOUNT_CHANGED
            - ALIAS_OWNERSHIP_CONFLICT
            - ALIAS_CONFIRMATION_PENDING
            - SYNC_FAILED
            - INTERNAL_ERROR
          description: |
            Apple 会话错误使用 APPLE_ 前缀，与后台登录会话的 AUTH_REQUIRED/SESSION_EXPIRED 分离。
        message:
          type: string
        request_id:
          type: string
          description: 与 X-Request-ID 响应头相同的请求追踪标识。

    CreateAliasResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CreateAliasData"

    CreateAliasData:
      type: object
      additionalProperties: false
      required:
        - alias
        - icloud
        - api_key
        - mail_api_direct_link
      properties:
        alias:
          type: string
          format: email
          description: 已登记并规范化的隐私邮箱地址。
        icloud:
          type: string
          format: email
          description: 该隐私邮箱所属、已登记的 iCloud 主号邮箱。
        api_key:
          type: string
          pattern: "^icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: |
            新隐私邮箱的原始邮件 API Key，仅在本次成功响应中显示一次。
            调用方应立即保存，服务端数据库只保存其哈希和辨认前缀。
        mail_api_direct_link:
          type: string
          format: uri-reference
          pattern: "^/api/v1/mail/recent\\?api_key=icm_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: |
            可直接访问、按当前邮件一次性消费的同源相对路径。查询参数是服务端生成的派生直达凭据，
            不是 `api_key` 字段中的原始邮件 API Key；轮换邮件 API Key 后该链接失效。
            成功访问会消费当前 UID，并异步把主号收件箱中的该邮件标记为已读；链接本身仍可等待
            后续未消费的新 UID。

    RecentMailResponse:
      type: object
      description: |
        返回此 200 响应前，本地消费历史和持久化 IMAP `\Seen` 任务已经在同一事务中提交。
        `\Seen` 由后台异步写回 iCloud，收到响应时主号中的邮件仍可能暂时显示为未读。
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/RecentMailData"

    RecentMailData:
      type: object
      additionalProperties: false
      required:
        - address
        - subject
        - snippet
        - sent_at
      properties:
        address:
          type: string
          format: email
          description: api_key 绑定的隐私邮箱地址。
        subject:
          type: string
          description: 邮件主题；邮件没有主题时为空字符串。
        snippet:
          type: string
          description: 单行纯文本；优先使用邮件声明的纯文本正文，纯文本为空时从 HTML 正文中提取可读文字，并过滤结构标签、样式、脚本及常见的内联隐藏内容。换行、制表符和连续空白会压缩成一个普通空格。内容可能因服务端邮件或正文大小上限而截断。
        sent_at:
          type: string
          format: date-time
          description: 邮件 Date 头，缺失或无效时回退到 IMAP INTERNALDATE；按服务端 TZ 对应时区格式化为 RFC 3339，并包含该时区的 UTC 偏移。最近一小时窗口仍按 IMAP INTERNALDATE 判断。
          examples:
            - "2026-08-07T12:30:00+08:00"

    LatestMailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/LatestMailData"

    LatestMailData:
      type: object
      additionalProperties: false
      required:
        - alias
        - message
        - synced_at
        - stale
      properties:
        alias:
          type: string
          format: email
          description: 当前 API Key 绑定的隐私邮箱地址。
        message:
          $ref: "#/components/schemas/MailMessage"
        synced_at:
          type: string
          format: date-time
          description: 这封邮件写入本地存储的 UTC 时间。
        stale:
          type: boolean
          const: false
          description: |
            成功响应中恒为 false。若当前隐私邮箱状态不是 ok、last_synced_at 为空，
            最后同步时间晚于当前时间，或最后同步距今超过三倍轮询周期，接口返回 503，
            而不会返回带 stale=true 的旧快照。

    MailMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - message_id
        - received_at
        - sent_at
        - from
        - to
        - cc
        - subject
        - text
        - html
        - attachments
        - has_attachments
        - body_truncated
      properties:
        id:
          type: string
          pattern: "^[0-9]+-[0-9]+$"
          description: 由 IMAP UIDVALIDITY 与 UID 组成的本地稳定标识。
        message_id:
          type: string
          description: 邮件 Message-ID 头；邮件未提供时可能为空字符串。
        received_at:
          type: string
          format: date-time
          description: IMAP INTERNALDATE，统一以 UTC RFC 3339 格式返回。
        sent_at:
          type:
            - string
            - "null"
          format: date-time
          description: 邮件 Date 头的 UTC RFC 3339 时间；缺失或无效时为 null。
        from:
          type: array
          items:
            $ref: "#/components/schemas/MailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/MailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/MailAddress"
        subject:
          type: string
        text:
          type: string
          description: 解析后的纯文本正文；不存在时为空字符串。
        html:
          type: string
          description: 解析后的 HTML 正文；不存在时为空字符串。
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        has_attachments:
          type: boolean
          description: attachments 是否至少包含一项。
        body_truncated:
          type: boolean
          description: 原始邮件或正文是否因服务端大小上限被截断。

    MailAddress:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        name:
          type: string
          description: 显示名称；为空时该字段会被省略。
        email:
          type: string
          format: email

    Attachment:
      type: object
      additionalProperties: false
      required:
        - filename
        - content_type
        - size
      properties:
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
          description: 附件大小，单位为字节。

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/APIError"

    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          description: 稳定、可供程序判断的错误码。
          examples:
            - INVALID_API_KEY
        message:
          type: string
          description: 面向调用方的错误说明。
        request_id:
          type: string
          description: 与 X-Request-ID 响应头相同的请求追踪标识。
