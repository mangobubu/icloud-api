openapi: 3.1.0
info:
  title: 隐私邮箱外部取件 API v2
  version: 2.0.0
  description: |
    本文档主要描述外部接口，并记录升级所需的少量管理兼容接口。服务提供两种
    取件能力：标准只读 IMAPS，以及使用 API Key 或派生取码 URL 读取验证码历史。

    管理端可为每个主号配置上游隐式 TLS IMAP 主机和端口；创建时默认使用
    `imap.mail.me.com:993`。修改规范化后的主机、端口或用户名代表切换邮箱来源，会清理
    旧来源的同步游标、兼容快照、消费历史、待处理 `\\Seen` 任务、v2 归档和 OTP 历史，
    轮换公开 IMAPS 的 `UIDVALIDITY`，并将同步状态重置为 `pending`。

    IMAPS 用户名是隐私邮箱地址。客户端可以使用本服务签发的 IMAP 密码登录，
    或通过 `POST /oauth2/v2.0/token` 获取一小时访问令牌后使用 XOAUTH2。
    邮箱只有只读 INBOX，支持 LIST、STATUS、SELECT/EXAMINE、SEARCH、
    FETCH/UID FETCH 和 IDLE；所有写操作返回只读错误。

    新 v2 alias 的 API Key、IMAP 密码、client ID、refresh token 与 access token
    均由本服务签发。legacy alias 的兼容轮换只替换 API Key 和由其派生的旧直达链接，
    保留消费记录、邮件快照和 IMAP Seen 状态；v2 凭证包轮换才会同时使旧 API Key、
    取码 URL、IMAP 密码、refresh token 和尚未过期的 access token 失效。
    v2 的只读 OTP URL 与消费 recent-mail URL 使用不同用途的派生 token，不能互换；
    原 v1 直达 token 只继续授权 legacy alias 的 `/api/v1/mail/recent`。
    迁移前已经领取的 legacy alias 不会因 schema 升级而轮换。兼容接口
    `/api/v1/aliases`、`/api/v1/mail/latest` 和 `/api/v1/mail/recent`
    保留原有路径、鉴权和响应语义。

    迁移前已经领取的 alias 保持 `legacy` API Key；新 alias，以及迁移前尚未领取
    pending Key 的 alias，才会补齐 v2 凭证。`latest_messages`、消费记录、IMAP `Seen`
    任务、pending Key 和 `api_key_prefix` 在迁移中保留。

    管理兼容接口同时挂载在安装级随机 `<admin-path>/api/v1` 和固定
    `/admin/api/v1`。固定入口仅用于旧客户端兼容，不提供管理界面；两个入口执行
    相同的登录限流、会话认证和 CSRF 校验。随机路径不是访问控制边界。
servers:
  - url: https://HOST
  # Admin operations below override this server with the installation-specific
  # path stored in the keys volume.
paths:
  /api/v1/aliases:
    post:
      tags:
        - Legacy Compatibility
      operationId: createLegacyAlias
      summary: 兼容登记已存在的隐私邮箱
      description: |
        保留 v1 的字段拼写 `add_hide_my_eamil`、`icloud`。两个字段可放在 query、
        `application/x-www-form-urlencoded` 正文，或分别放在两处；query 与正文合并后
        每个字段必须恰好出现一次，且不能包含其他字段。正文为空时不要求
        `Content-Type`。使用部署级 `ICLOUD_API_OAUTH_TOKEN` 的严格单一 Bearer 鉴权；
        成功响应直接返回 `api_key` 和 `mail_api_direct_link`；v2 凭证随后仍可由
        已认证管理端读取。该接口只登记 Apple 端已经存在的隐私邮箱，不负责创建
        地址。query 与正文合计不得超过 4 KiB。
      x-runtime-constraint:
        query-form-merge: >-
          OpenAPI 无法表达跨 query 与表单正文的联合必填约束；服务端合并两处参数后，
          要求 add_hide_my_eamil 与 icloud 各恰好出现一次，并拒绝任何其他字段。
      security:
        - externalOAuthToken: []
      parameters:
        - name: add_hide_my_eamil
          in: query
          required: false
          description: 可替代表单字段；合并 query 与正文后必须恰好出现一次。
          schema:
            type: string
            format: email
        - name: icloud
          in: query
          required: false
          description: 可替代表单字段；合并 query 与正文后必须恰好出现一次。
          schema:
            type: string
            format: email
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LegacyAliasRequest"
            example:
              add_hide_my_eamil: alias@icloud.com
              icloud: primary@icloud.com
      responses:
        "201":
          description: 登记成功并返回兼容 API Key 与直达链接
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyAliasResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/InvalidOAuthToken"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mail/latest:
    get:
      tags:
        - Legacy Compatibility
      operationId: getLegacyLatestMail
      summary: 兼容读取当前最新完整邮件快照
      description: |
        使用原有 `Authorization: Bearer <API Key>`。请求可重复执行，不消费邮件，
        不写入消费记录，也不改变 IMAP `Seen` 状态；已领取 legacy Key 和 v2 Key
        均可按绑定 alias 读取。
      security:
        - aliasAPIKey: []
      responses:
        "200":
          description: 当前最新邮件快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyLatestMailResponse"
        "401":
          $ref: "#/components/responses/InvalidCredential"
        "404":
          $ref: "#/components/responses/MailNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/mail/recent:
    get:
      tags:
        - Legacy Compatibility
      operationId: getLegacyRecentMail
      summary: 兼容消费最近一小时内的当前邮件
      description: |
        使用原有 `api_key` 查询参数（只能出现一次），接受 API Key、legacy alias 的
        原 v1 直达 token，或 v2 alias 的 recent-mail 专用 token。成功后原子记录消费
        状态并异步写入主号 IMAP `Seen`；同一 UID 的后续请求继续返回
        `MAIL_NOT_FOUND`。旧 legacy 直达链接保持路径和 token 不变；OTP 专用 token
        不授权此接口。
      security:
        - aliasAPIKeyQuery: []
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 当前快照已消费并加入 IMAP Seen 队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRecentMailResponse"
        "401":
          $ref: "#/components/responses/InvalidCredential"
        "404":
          $ref: "#/components/responses/MailNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/otp:
    get:
      summary: 读取当前隐私邮箱的验证码历史
      description: |
        返回最新优先、持续累积的裸数组，每个邮箱最多 100 条。
        重复读取不会消费验证码，也不会修改邮件已读状态。没有验证码时返回 `200 []`。
        调用方必须二选一：使用 Bearer API Key，或传入管理端签发取码 URL 中的 OTP
        专用派生 token。recent-mail token 和原 v1 直达 token 不授权此接口。
      security:
        - aliasAPIKey: []
        - derivedToken: []
      parameters:
        - name: token
          in: query
          required: false
          description: 取码 URL 中的 OTP 专用派生 token；使用时不得同时发送 Authorization。
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 验证码历史；没有记录时为一个空数组。
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/OTPRecord"
              examples:
                records:
                  value:
                    - otp: "123456"
                      time: "2026-08-11T12:00:00+08:00"
                empty:
                  value: []
        "401":
          $ref: "#/components/responses/InvalidCredential"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/accounts:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    get:
      tags:
        - Admin Accounts
      operationId: listAdminAccounts
      summary: 查询主号列表
      description: |
        按主号邮箱、ID 升序返回分页列表。`query` 会先去除首尾空白，再对主号邮箱和备注执行
        不区分大小写的字面量子串匹配；空查询返回全部主号。响应中的 `pagination.total` 是当前
        查询条件下的主号总数，`has_more` 表示当前页之后是否还有结果。
      security:
        - adminSession: []
      parameters:
        - name: query
          in: query
          required: false
          description: 主号邮箱或备注的搜索词；服务会先去除首尾空白，处理后的值最多 200 个字符。
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 本页最多返回的主号数。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          required: false
          description: 在当前查询结果中跳过的主号数。
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: 当前查询条件下的一页主号
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountListResponse"
        "400":
          description: query、limit 或 offset 参数无效
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppleErrorResponse"
              examples:
                invalidLimit:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: limit 参数无效
                      request_id: 6oe7j0x3x3pJv9Dv
                queryTooLong:
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: query 参数不能超过 200 个字符
                      request_id: 6oe7j0x3x3pJv9Dv
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "500":
          $ref: "#/components/responses/AdminInternalError"
    post:
      tags:
        - Admin Accounts
      operationId: createAdminAccount
      summary: 添加主号
      description: |
        添加用于主号级邮件同步的账户。`imap_host` 和 `imap_port` 可分别指定隐式 TLS
        IMAP 服务；省略时分别使用 `imap.mail.me.com` 和 `993`，显式传入 `null` 则返回 400。
        App 专用密码只会加密保存，不会出现在响应或日志中。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateAccountRequest"
            example:
              name: 个人主号
              email: owner@icloud.com
              imap_host: imap.mail.me.com
              imap_port: 993
              imap_username: owner@icloud.com
              imap_password: APP_SPECIFIC_PASSWORD
      responses:
        "201":
          description: 主号创建成功
          headers:
            Location:
              description: 新主号的管理 API 相对路径。
              schema:
                type: string
                format: uri-reference
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountResponse"
        "400":
          $ref: "#/components/responses/AdminAccountBadRequest"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "409":
          $ref: "#/components/responses/AdminAccountConflict"
        "413":
          $ref: "#/components/responses/AdminJSONTooLarge"
        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "500":
          $ref: "#/components/responses/AdminInternalError"


  /api/v1/accounts/{id}:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    get:
      tags:
        - Admin Accounts
      operationId: getAdminAccount
      summary: 获取主号详情
      description: 返回主号、所属隐私邮箱、Apple 会话状态和自动创建计划。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
      responses:
        "200":
          description: 主号详情
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDetailResponse"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "404":
          $ref: "#/components/responses/AdminAccountNotFound"
        "500":
          $ref: "#/components/responses/AdminInternalError"
    put:
      tags:
        - Admin Accounts
      operationId: updateAdminAccount
      summary: 更新主号
      description: |
        更新主号配置。省略 `imap_host` 或 `imap_port` 时分别保留当前值，显式传入 `null` 则
        返回 400。规范化后的 IMAP 主机、端口或用户名实际发生变化后，服务会清除该主号旧邮箱
        来源的同步游标、兼容快照、消费历史、待处理 `\Seen` 任务、v2 归档和 OTP 历史，轮换
        公开 IMAPS 的 `UIDVALIDITY`，并在下次同步确认前把主号及所属隐私邮箱的同步状态重置为
        `pending`。修改 App 专用密码也会重置同步状态，但保留已有邮件；`imap_password` 省略、
        传 `null` 或传空字符串时均保留当前密码。
        已有隐私邮箱后，仅主号邮箱不可修改；IMAP 主机、端口和用户名仍可修改。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateAccountRequest"
            example:
              name: 个人主号
              email: owner@icloud.com
              imap_host: imap.example.com
              imap_port: 993
              imap_username: owner@icloud.com
              imap_password: ""
              enabled: true
      responses:
        "200":
          description: 主号配置已更新
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountResponse"
        "400":
          $ref: "#/components/responses/AdminAccountBadRequest"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "404":
          $ref: "#/components/responses/AdminAccountNotFound"
        "409":
          $ref: "#/components/responses/AdminAccountConflict"
        "413":
          $ref: "#/components/responses/AdminJSONTooLarge"
        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "500":
          $ref: "#/components/responses/AdminInternalError"
    delete:
      tags:
        - Admin Accounts
      operationId: deleteAdminAccount
      summary: 删除主号
      description: |
        永久删除本地主号及其所属隐私邮箱、API Key、邮件快照、消费历史、待处理 `\Seen` 任务、
        v2 归档元数据和 MIME 文件、IMAP 同步游标、Apple Web 会话和自动创建计划。该操作只
        清理本地数据，不会删除 Apple Hide My Email 中的远端地址。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "204":
          description: 本地主号及其关联数据已删除
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
        "401":
          $ref: "#/components/responses/AdminAuthUnauthorized"
        "403":
          $ref: "#/components/responses/AdminCSRFForbidden"
        "404":
          $ref: "#/components/responses/AdminAccountNotFound"
        "500":
          $ref: "#/components/responses/AdminInternalError"


  /oauth2/v2.0/token:
    post:
      summary: 用 refresh token 换取 IMAPS XOAUTH2 访问令牌
      description: |
        此接口是只读 IMAPS 的配套认证接口，不构成第三种取件方式。
        client ID 与 refresh token 都属于同一个隐私邮箱并由本服务签发。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [grant_type, client_id, refresh_token]
              properties:
                grant_type:
                  type: string
                  const: refresh_token
                client_id:
                  type: string
                refresh_token:
                  type: string
      responses:
        "200":
          description: 一小时有效的 Bearer access token。
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                access_token: ACCESS_TOKEN
                token_type: Bearer
                expires_in: 3600
        "400":
          $ref: "#/components/responses/OAuthInvalidRequest"
        "401":
          $ref: "#/components/responses/OAuthInvalidClient"
        "429":
          $ref: "#/components/responses/OAuthUnavailable"
        "503":
          $ref: "#/components/responses/OAuthUnavailable"

  /api/v1/accounts/{id}/aliases/auto-create/keys:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    get:
      tags:
        - Legacy Compatibility
      operationId: getPendingAliasAutoCreationKeys
      summary: 读取待领取自动创建 API Key
      description: 读取不会删除队列；只有随后提交 alias ID 的 DELETE 确认才会删除对应 pending Key。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
      responses:
        "200":
          description: 当前待领取 Key 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPendingAliasKeysResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "500":
          $ref: "#/components/responses/AdminInternalError"
    delete:
      tags:
        - Legacy Compatibility
      operationId: acknowledgePendingAliasAutoCreationKeys
      summary: 确认已保存待领取 API Key
      description: 仅删除请求列出的 alias ID；重复确认幂等，未列出的 pending Key 保留。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPendingAliasKeysRequest"
      responses:
        "204":
          description: 指定 Key 已确认并从队列删除
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "413":
          $ref: "#/components/responses/AdminRequestTooLarge"
        "415":
          $ref: "#/components/responses/AdminUnsupportedMediaType"
        "500":
          $ref: "#/components/responses/AdminInternalError"

  /api/v1/aliases/{id}/rotate-key:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    post:
      tags:
        - Legacy Compatibility
      operationId: rotateLegacyAliasKey
      summary: 兼容轮换 alias 的 API Key
      description: |
        只替换 API Key 及由它派生的旧直达链接，不改变 credential mode，
        不清除消费记录、邮件快照或 IMAP Seen 状态，也不替换 v2 alias 的
        IMAP 密码、client ID、refresh token 和 credential version。
        本次响应直接返回新 API Key；legacy alias 不保存可恢复明文，v2 alias 的当前
        凭证仍可由已认证管理端读取。schema 迁移不会调用此接口。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAliasID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "200":
          description: 在本次受保护响应中直接返回新 API Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOneTimeKeyResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminAliasConflict"
        "500":
          $ref: "#/components/responses/AdminInternalError"

  /api/v1/aliases/{id}/rotate-credentials:
    servers:
      - url: https://HOST/{admin_path}
        description: 首选的安装级随机管理 API 前缀；将 admin_path 替换为 keys 卷中值去掉首尾斜杠后的形式
        variables:
          admin_path:
            default: 00000000000000000000000000000000/admin
            description: 首次启动生成并持久化的管理路径，替换时去掉文件值的开头和结尾斜杠
      - url: https://HOST/admin
        description: 升级前客户端使用的固定兼容入口；认证、CSRF 和限流规则相同
    post:
      tags:
        - Administration
      operationId: rotateAliasCredentials
      summary: 轮换 v2 alias 的完整凭证包
      description: |
        仅接受 v2 alias。显式调用后同时替换 API Key、派生取码 URL、IMAP 密码、
        client ID 和 refresh token，并使已有 access token 失效；不清除邮件归档、
        兼容消费记录或 IMAP Seen 状态。legacy alias 和等待目录确认的 alias 返回 409。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAliasID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "200":
          description: 返回新的完整凭证；当前 v2 凭证随后仍可由已认证管理端读取
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAliasResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminAliasConflict"
        "500":
          $ref: "#/components/responses/AdminInternalError"

components:
  securitySchemes:
    externalOAuthToken:
      type: http
      scheme: bearer
      bearerFormat: deployment OAuth token
    aliasAPIKey:
      type: http
      scheme: bearer
      bearerFormat: service-issued API Key
    derivedToken:
      type: apiKey
      in: query
      name: token
      description: 仅授权只读 OTP 历史；不能用于消费 recent-mail。
    aliasAPIKeyQuery:
      type: apiKey
      in: query
      name: api_key
    adminSession:
      type: apiKey
      in: cookie
      name: icloud_admin_session
  parameters:
    AdminAccountID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminAliasID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AdminCSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  headers:
    RequestID:
      description: 服务端生成的请求追踪标识；错误响应体中的 request_id 与此值一致。
      schema:
        type: string
      example: 6oe7j0x3x3pJv9Dv
    AdminNoStore:
      description: 禁止保存包含后台状态或一次性凭据的响应。
      schema:
        type: string
        const: no-store, private
      example: no-store, private



  schemas:
    AdminAccountListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccountPage"

    AdminAppleErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/AdminAppleError"

    AdminCreateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - imap_username
        - imap_password
      properties:
        name:
          type: string
          maxLength: 80
          description: 可选备注；服务会去除首尾空白。
        email:
          type: string
          format: email
          description: iCloud 主号邮箱；保存前会规范化大小写和首尾空白。
        imap_host:
          type: string
          minLength: 1
          default: imap.mail.me.com
          description: |
            隐式 TLS IMAP 主机名或 IP 地址，省略时使用 `imap.mail.me.com`；显式 `null` 无效。
            服务会先去除首尾空白，之后在去除末尾根点前要求值最多 253 字节，并拒绝主机内部
            空白；IPv6 地址必须不带方括号。服务不接受 URL scheme、用户信息、端口、路径、查询
            或 fragment；DNS 标签只能包含字母、数字和连字符，且不能以连字符开头或结尾。DNS
            主机会去除末尾根点并规范化为小写，IP 地址会规范化。
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 993
          description: 隐式 TLS IMAP 端口；省略时使用 993，显式 `null` 无效。
        imap_username:
          type: string
          minLength: 1
          description: IMAP 登录用户名；服务会去除首尾空白。
        imap_password:
          type: string
          minLength: 1
          writeOnly: true
          description: App 专用密码；服务会去除首尾空白并加密保存，不会在响应中返回。

    AdminAccountResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccount"

    AdminAccountDetailResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AdminAccountDetail"

    AdminUpdateAccountRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - imap_username
        - enabled
      properties:
        name:
          type: string
          maxLength: 80
          description: 可选备注；服务会去除首尾空白。
        email:
          type: string
          format: email
          description: iCloud 主号邮箱；已有隐私邮箱时必须与当前值一致。
        imap_host:
          type: string
          minLength: 1
          description: |
            新的隐式 TLS IMAP 主机名或 IP 地址；省略时保留当前主机，显式 `null` 无效。服务会
            先去除首尾空白，之后在去除末尾根点前要求值最多 253 字节，并拒绝主机内部空白；
            IPv6 地址必须不带方括号。显式空字符串也无效。不接受 URL scheme、用户信息、端口、
            路径、查询或 fragment；DNS 标签只能包含字母、数字和连字符，且不能以连字符开头或
            结尾。DNS 主机会去除末尾根点并规范化为小写，IP 地址会规范化。
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 新的隐式 TLS IMAP 端口；省略时保留当前端口，显式 `null` 无效。
        imap_username:
          type: string
          minLength: 1
          description: |
            IMAP 登录用户名；服务会去除首尾空白，已有隐私邮箱时仍可修改。规范化后的值实际变化
            会清理旧邮箱来源的同步游标、兼容快照、消费历史、待处理 `\Seen` 任务、v2 归档和
            OTP 历史，轮换公开 IMAPS 的 UIDVALIDITY，并重置同步状态。
        imap_password:
          type:
            - string
            - "null"
          writeOnly: true
          description: 新 App 专用密码；省略、传 `null` 或传空字符串时保留当前密码。
        enabled:
          type: boolean
          description: 是否启用该主号的邮件同步和所属隐私邮箱 Key。

    AdminAccountPage:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
        pagination:
          $ref: "#/components/schemas/AdminAccountPagination"

    AdminAppleError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - SESSION_EXPIRED
            - CSRF_INVALID
            - INVALID_CREDENTIALS
            - CURRENT_PASSWORD_INVALID
            - CREDENTIALS_CHANGED
            - RATE_LIMITED
            - NOT_FOUND
            - INVALID_JSON
            - VALIDATION_FAILED
            - REQUEST_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - APPLE_LOGIN_REQUIRED
            - APPLE_SESSION_EXPIRED
            - APPLE_CREDENTIALS_INVALID
            - APPLE_VERIFICATION_INVALID
            - APPLE_FLOW_EXPIRED
            - APPLE_ACCOUNT_ACTION_REQUIRED
            - APPLE_RATE_LIMITED
            - APPLE_UPSTREAM_ERROR
            - AUTO_CREATION_UNAVAILABLE
            - ACCOUNT_DISABLED
            - ACCOUNT_EXISTS
            - ACCOUNT_IDENTITY_LOCKED
            - APPLE_ACCOUNT_MISMATCH
            - ACCOUNT_CHANGED
            - ALIAS_OWNERSHIP_CONFLICT
            - ALIAS_CONFIRMATION_PENDING
            - ALIAS_EXISTS
            - ALIAS_LIMIT_REACHED
            - SYNC_FAILED
            - INTERNAL_ERROR
          description: |
            Apple 会话错误使用 APPLE_ 前缀，与后台登录会话的 AUTH_REQUIRED/SESSION_EXPIRED 分离。
        message:
          type: string
        request_id:
          type: string
          description: 与 X-Request-ID 响应头相同的请求追踪标识。

    AdminAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - imap_host
        - imap_port
        - imap_username
        - enabled
        - last_sync_status
        - last_sync_error
        - last_sync_error_log
        - last_synced_at
        - created_at
        - updated_at
        - alias_count
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        imap_host:
          type: string
          minLength: 1
          maxLength: 253
          description: 该主号实际使用的隐式 TLS IMAP 主机名或 IP 地址。
        imap_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 该主号实际使用的隐式 TLS IMAP 端口。
        imap_username:
          type: string
        enabled:
          type: boolean
        last_sync_status:
          type: string
        last_sync_error:
          type: string
          description: 最近同步错误的简短摘要；最近一次同步没有错误时为空字符串。
        last_sync_error_log:
          type: string
          description: 最近同步错误的完整日志；最近一次同步没有错误时为空字符串。
        last_synced_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        alias_count:
          type: integer
          minimum: 0
        sync_progress:
          $ref: "#/components/schemas/AdminSyncProgress"

    AdminAccountDetail:
      type: object
      additionalProperties: false
      required:
        - account
        - aliases
        - apple_session
        - auto_creation
      properties:
        account:
          $ref: "#/components/schemas/AdminAccount"
        aliases:
          type: array
          items:
            $ref: "#/components/schemas/AdminAlias"
        apple_session:
          description: |
            该主号的 Apple Web 会话状态。正常启用目录同步服务时返回对象；
            服务未初始化的降级场景为 null。Apple 账户密码、验证码和加密会话正文不会返回。
          oneOf:
            - $ref: "#/components/schemas/AdminAppleSession"
            - type: "null"
        auto_creation:
          $ref: "#/components/schemas/AdminAliasAutoCreation"
        sync_pending:
          type: boolean
          description: |
            仅在手动邮件同步返回 202 时出现且恒为 true，表示请求已进入后台队列，
            或同一主号已有同步任务正在处理。

    AdminAccountPagination:
      type: object
      additionalProperties: false
      required:
        - limit
        - offset
        - total
        - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: 当前请求的每页上限。
        offset:
          type: integer
          minimum: 0
          maximum: 1000000
          description: 当前请求跳过的主号数。
        total:
          type: integer
          minimum: 0
          description: 当前查询条件下的主号总数。
        has_more:
          type: boolean
          description: 当前页之后是否仍有可返回的主号。

    AdminSyncProgress:
      type: object
      additionalProperties: false
      required:
        - active
        - source
        - stage
        - percentage
        - started_at
        - updated_at
      properties:
        active:
          type: boolean
          const: true
          description: 该对象出现时恒为 true；同步结束后整个 sync_progress 字段省略。
        source:
          type: string
          enum:
            - manual
            - automatic
          description: 本次同步由管理员手动发起，或由定时任务自动发起。
        stage:
          type: string
          enum:
            - queued
            - waiting
            - preparing
            - connecting
            - authenticating
            - scanning
            - reading
            - validating
            - saving
        percentage:
          type: integer
          minimum: 0
          maximum: 100
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminAppleSession:
      type: object
      additionalProperties: false
      required:
        - status
        - apple_id
        - region
        - authenticated_at
        - expires_at
      properties:
        status:
          type: string
          enum:
            - login_required
            - verification_required
            - authenticated
            - expired
          description: |
            login_required 表示尚无会话；verification_required 表示正在等待验证码；
            authenticated 表示可同步目录；expired 表示需要重新登录。
        apple_id:
          type: string
          description: 连接的 Apple ID；尚无会话时为空字符串。
        region:
          type: string
          enum:
            - ""
            - global
            - cn
          description: Apple 服务区域；尚无会话时为空字符串。
        authenticated_at:
          type:
            - string
            - "null"
          format: date-time
          description: 受信任会话认证完成的 UTC 时间；未完成登录时为 null。
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: 已知的会话或验证码挑战到期时间；上游未提供时为 null。

    AdminAliasAutoCreation:
      type: object
      additionalProperties: false
      required:
        - enabled
        - status
        - planned_at
        - planned_times
        - next_run_at
        - last_attempted_at
        - last_created_at
        - last_alias_address
        - last_error
        - pending_key_count
        - pending_auto_created_key_count
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum:
            - disabled
            - scheduled
            - paused
            - login_required
            - error
          description: 当前计划状态；login_required 表示需重新登录 Apple，会话失效不会自动关闭开关。
        planned_at:
          type:
            - string
            - "null"
          format: date-time
          description: 当前剩余计划的第一个时间点；没有剩余计划时为 null。
        planned_times:
          type: array
          items:
            type: string
            format: date-time
          description: 当前剩余计划的全部 UTC 时间点，最多 5 个。
        next_run_at:
          type:
            - string
            - "null"
          format: date-time
        last_attempted_at:
          type:
            - string
            - "null"
          format: date-time
        last_created_at:
          type:
            - string
            - "null"
          format: date-time
        last_alias_address:
          type: string
        last_error:
          type: string
          description: 最近一次尝试的截断错误信息；不会包含原始 API Key 或 Apple 会话材料。
        pending_key_count:
          type: integer
          minimum: 0
        pending_auto_created_key_count:
          type: integer
          minimum: 0

    OTPRecord:
      type: object
      additionalProperties: false
      required: [otp, time]
      properties:
        otp:
          type: string
          pattern: "^[0-9]{4,8}$"
        time:
          type: string
          format: date-time
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 3600
    LegacyAliasRequest:
      type: object
      additionalProperties: false
      description: >-
        正文中的可选部分；query 与正文合并后两个字段必须各出现一次。该跨位置约束
        无法由标准 OpenAPI Schema 单独表达，调用方和生成代码必须遵守 operation 上的
        x-runtime-constraint。
      properties:
        add_hide_my_eamil:
          type: string
          format: email
        icloud:
          type: string
          format: email
    LegacyAliasResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [alias, icloud, api_key, mail_api_direct_link]
          properties:
            alias:
              type: string
              format: email
            icloud:
              type: string
              format: email
            api_key:
              type: string
            mail_api_direct_link:
              type: string
              format: uri-reference
              pattern: "^/api/v1/mail/recent\\?api_key=.*$"
    LegacyLatestMailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          required: [alias, message, synced_at, stale]
          properties:
            alias:
              type: string
              format: email
            message:
              $ref: "#/components/schemas/LegacyMailMessage"
            synced_at:
              type: string
              format: date-time
            stale:
              type: boolean
    LegacyRecentMailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [address, subject, snippet, sent_at]
          properties:
            address:
              type: string
              format: email
            subject:
              type: string
            snippet:
              type: string
            sent_at:
              type: string
              format: date-time
    LegacyMailMessage:
      type: object
      additionalProperties: true
      required: [id, message_id, received_at, from, to, cc, subject, text, html, attachments, has_attachments, body_truncated]
      properties:
        id:
          type: string
        message_id:
          type: string
        received_at:
          type: string
          format: date-time
        sent_at:
          type:
            - string
            - "null"
          format: date-time
        from:
          type: array
          items:
            $ref: "#/components/schemas/MailAddress"
        to:
          type: array
          items:
            $ref: "#/components/schemas/MailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/MailAddress"
        subject:
          type: string
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          items:
            type: object
            additionalProperties: true
        has_attachments:
          type: boolean
        body_truncated:
          type: boolean
    MailAddress:
      type: object
      additionalProperties: true
      required: [email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    AdminPendingAliasKeysRequest:
      type: object
      additionalProperties: false
      required: [alias_ids]
      properties:
        alias_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
    AdminPendingAliasKeysResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [created]
          properties:
            created:
              type: array
              items:
                $ref: "#/components/schemas/AdminPendingAliasKey"
    AdminPendingAliasKey:
      type: object
      additionalProperties: false
      required: [alias, api_key]
      properties:
        alias:
          $ref: "#/components/schemas/AdminAlias"
        api_key:
          type: string
        mail_api_direct_link:
          type: string
          format: uri-reference
          description: Apple 目录确认完成后返回；等待确认时省略，不能作为可用链接。
    AdminOneTimeKeyResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [alias, api_key]
          properties:
            alias:
              $ref: "#/components/schemas/AdminAlias"
            api_key:
              type: string
    AdminAliasResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminAlias"
    AdminAlias:
      type: object
      additionalProperties: true
      required: [id, account_id, account_email, address, label, enabled]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        account_id:
          type: integer
          format: int64
          minimum: 1
        account_email:
          type: string
          format: email
        address:
          type: string
          format: email
        label:
          type: string
        api_key_prefix:
          type: string
        direct_link_path:
          type: string
          format: uri-reference
          description: recent-mail 消费路径；legacy 保留原 v1 token，v2 使用 recent-mail 专用 token；等待 Apple 目录确认时省略。
        legacy_direct_link_path:
          type: string
          format: uri-reference
        otp_url_path:
          type: string
          format: uri-reference
          description: v2 使用只读 OTP 专用 token；legacy 保持原 recent-mail 兼容路径。
        credential_mode:
          type: string
          enum: [legacy, v2]
        api_key:
          type: string
          description: 仅在服务持有可解密的 v2 凭证时返回明文。
        imap_password:
          type: string
        client_id:
          type: string
        refresh_token:
          type: string
        credential_version:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
    APIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
  responses:
    AdminAuthUnauthorized:
      description: 后台会话 Cookie 缺失、无效或已经过期
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            loginRequired:
              value:
                error:
                  code: AUTH_REQUIRED
                  message: 请先登录
                  request_id: 6oe7j0x3x3pJv9Dv
            sessionExpired:
              value:
                error:
                  code: SESSION_EXPIRED
                  message: 登录会话已过期
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountBadRequest:
      description: JSON 格式错误、含有未知字段，或主号字段校验失败
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            invalidJSON:
              value:
                error:
                  code: INVALID_JSON
                  message: JSON 请求体格式错误或包含未知字段
                  request_id: 6oe7j0x3x3pJv9Dv
            invalidIMAPHost:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: "IMAP 服务地址无效: invalid imap DNS label"
                  request_id: 6oe7j0x3x3pJv9Dv
            invalidIMAPPort:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: "IMAP 服务地址无效: imap port must be between 1 and 65535"
                  request_id: 6oe7j0x3x3pJv9Dv
            nullIMAPHost:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: IMAP 主机不能为 null
                  request_id: 6oe7j0x3x3pJv9Dv
            nullIMAPPort:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: IMAP 端口不能为 null
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminCSRFForbidden:
      description: X-CSRF-Token 缺失、无效，或请求未通过同源校验
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: CSRF_INVALID
              message: 请求校验失败，请刷新页面后重试
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountConflict:
      description: 主号邮箱已存在，或已有隐私邮箱后尝试修改主号邮箱
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          examples:
            accountExists:
              value:
                error:
                  code: ACCOUNT_EXISTS
                  message: 这个主号已经存在
                  request_id: 6oe7j0x3x3pJv9Dv
            identityLocked:
              value:
                error:
                  code: ACCOUNT_IDENTITY_LOCKED
                  message: 已有隐私邮箱时不能修改主号邮箱
                  request_id: 6oe7j0x3x3pJv9Dv

    AdminJSONTooLarge:
      description: JSON 请求体超过 64 KiB
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: JSON 请求体不能超过 64 KiB
              request_id: 6oe7j0x3x3pJv9Dv

    AdminAccountNotFound:
      description: 指定的本地主号不存在
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/AdminNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminAppleErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: 主号不存在
              request_id: 6oe7j0x3x3pJv9Dv

    InvalidRequest:
      description: 参数缺失、重复、格式错误，或包含不支持的字段（`INVALID_REQUEST`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    InvalidCredential:
      description: Bearer 凭据、API Key 或派生 token 无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    InvalidOAuthToken:
      description: 部署级 OAuth Bearer 凭据无效（`INVALID_OAUTH_TOKEN`）。
      headers:
        WWW-Authenticate:
          description: Bearer 鉴权提示。
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    MailNotFound:
      description: 当前没有符合条件且尚未消费的邮件（`MAIL_NOT_FOUND`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    NotFound:
      description: 请求的主号、alias 或邮件不存在。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    Conflict:
      description: alias 已存在或主号已达到启用数量上限。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    RequestTooLarge:
      description: query 与正文合计超过 4 KiB（`REQUEST_TOO_LARGE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    UnsupportedMediaType:
      description: 非空正文没有使用 `application/x-www-form-urlencoded`（`UNSUPPORTED_MEDIA_TYPE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    RateLimited:
      description: 请求过于频繁。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    Unavailable:
      description: 服务暂不可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    InternalError:
      description: 服务处理凭据或直达链接时发生内部错误。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminBadRequest:
      description: JSON 无效、包含未知字段或业务参数校验失败（`INVALID_JSON` 或 `VALIDATION_FAILED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminUnauthorized:
      description: 管理会话缺失或已过期（`AUTH_REQUIRED` 或 `SESSION_EXPIRED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminForbidden:
      description: CSRF token 或同源校验失败（`CSRF_INVALID`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminNotFound:
      description: 管理资源不存在或路径 ID 无效（`NOT_FOUND`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminAliasConflict:
      description: alias 等待 Apple 确认或不支持所请求的凭证轮换模式（`ALIAS_CONFIRMATION_PENDING` 或 `ALIAS_CREDENTIAL_MODE_UNSUPPORTED`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminRequestTooLarge:
      description: JSON 请求体超过 64 KiB（`REQUEST_TOO_LARGE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminUnsupportedMediaType:
      description: JSON 管理操作未使用 `application/json`（`UNSUPPORTED_MEDIA_TYPE`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    AdminInternalError:
      description: 管理 API 处理失败（`INTERNAL_ERROR`）。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    OAuthInvalidRequest:
      description: OAuth 表单格式错误。
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: invalid_request
              error_description:
                type: string
    OAuthInvalidClient:
      description: client ID 或 refresh token 无效。
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: invalid_client
              error_description:
                type: string
    OAuthUnavailable:
      description: 令牌服务暂不可用或请求受到限流。
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error:
                const: temporarily_unavailable
              error_description:
                type: string
