openapi: 3.1.0
info:
  title: iCloud 隐私邮箱 API
  version: 2.0.0
  description: |
    每个隐私邮箱使用独立的 API Key。服务端根据该 Key 绑定到唯一隐私邮箱，
    只返回该隐私邮箱通过所属 iCloud 主号级 `UNSEEN` 同步写入的最新数据库快照。
    邮件可用性按隐私邮箱自身的同步状态和同步时间独立判断，而不是直接使用主号的整体同步状态。
    `/api/v1/aliases` 使用部署时配置的独立 OAuth Bearer 令牌，将已存在的隐私邮箱登记到现有主号；
    管理端可按主号选择性开启 Apple Hide My Email 自动创建，每 60 分钟最多尝试 5 次，
    每次间隔至少 5 分钟。自动创建的原始 API Key 进入加密的待领取队列，不会出现在日志中。
    `/api/v1/mail/latest` 使用 Bearer Header，可重复返回已保存快照的完整 UTC 数据，
    且不消费邮件或改变已读状态；`/api/v1/mail/recent` 使用 URL 查询参数，一次性消费
    IMAP 收件时间位于最近一小时内的当前最新邮件，并返回按服务端 `TZ` 格式化的紧凑数据。

    管理端 Apple 接口使用 Apple 账户密码和双重认证建立受信任 Web 会话，并通过
    `/v2/hme/list` 读取完整 Hide My Email 目录；账户密码和验证码不落库，仅加密保存会话。
    该会话不参与邮件获取。邮件同步通过 `imap.mail.me.com:993` 与 App 专用密码执行主号级
    `UNSEEN` 发现，再用 `BODY.PEEK` 读取未读候选的邮件头和正文。首次同步、游标重置或 UIDVALIDITY
    变化时只先确定最近最多 1024 封邮件的窗口边界，后续仍仅分批处理窗口内的 `UNSEEN`；
    不读取已读邮件正文，也不恢复各隐私邮箱的历史 IMAP 快照。部署前提是没有其他邮件客户端或外部流程
    在服务同步前读取该 INBOX。直达接口只查询 PostgreSQL；成功消费后，后台按主号异步把对应 UID 标记为 `\Seen`。
servers:
  - url: http://127.0.0.1:8080
    description: 默认本地服务地址，可由 ICLOUD_API_ADDR 调整
tags:
  - name: Aliases
    description: 供外部系统登记已存在的隐私邮箱
  - name: Mail
    description: 隐私邮箱收件接口
  - name: Admin Accounts
    description: 管理端主号与 IMAP 邮件同步
  - name: Admin Apple
    description: 管理端 Apple 受信任会话、完整隐私邮箱目录同步与远端永久删除
  - name: Admin Logs
    description: 管理端当前进程应用日志
  - name: Health
    description: 服务健康检查

paths:
  /api/v1/aliases:
    post:
      tags:
        - Aliases
      operationId: createAlias
      summary: 将已存在的隐私邮箱登记到 iCloud 主号
      description: |
        使用部署时通过 `ICLOUD_API_OAUTH_TOKEN` 配置的独立 OAuth Bearer 令牌鉴权。
        令牌必须包含 32 至 4096 个字符且不得包含空白；本接口不接受隐私邮箱自己的 `icm_` 邮件 API Key。

        本接口只在本地登记已经由 Apple/iCloud 创建并启用的隐私邮箱，不会调用 Apple 创建地址；
        Apple 地址的自动创建只通过管理端主号级开关触发。
        `add_hide_my_eamil` 是兼容契约中保留的字段拼写，表示待登记的隐私邮箱；
        `icloud` 表示已在管理端登记的所属 iCloud 主号邮箱。
        隐私邮箱不能与任何已登记主号邮箱或所选主号的 IMAP 用户名相同。

        推荐把两个字段放入 `application/x-www-form-urlencoded` 正文。为兼容已有调用方，
        也可将字段放在 URL 查询串中；查询串会将邮箱暴露给代理日志、监控和浏览器历史。
        每个字段在查询串与正文合计必须恰好出现一次，重复字段及未知字段均返回 400。
        只要请求含有正文，其 Content-Type 就必须是 `application/x-www-form-urlencoded`。

        成功响应中的 `api_key` 是新隐私邮箱仅显示一次的原始邮件 API Key；
        `mail_api_direct_link` 是同源相对路径，其 `api_key` 查询参数是服务端生成的派生直达凭据，
        不是原始 `api_key`。直达链接按当前 UID 一次性消费邮件并异步设置主号全局 `\Seen`；链接本身
        在成功消费后仍有效，后续未消费的新 UID 到来时可再次使用。新地址初始为 `pending`，须等待
        下一轮同步确认后才能按收件 API 规则使用。
        所有成功及错误响应均包含 `Cache-Control: no-store`。
      security:
        - externalOAuthToken: []
      parameters:
        - name: add_hide_my_eamil
          in: query
          required: false
          description: 兼容用法；待登记的隐私邮箱。推荐改用表单正文，且查询串与正文合计必须恰好出现一次。
          schema:
            type: string
            format: email
        - name: icloud
          in: query
          required: false
          description: 兼容用法；所属 iCloud 主号邮箱。推荐改用表单正文，且查询串与正文合计必须恰好出现一次。
          schema:
            type: string
            format: email
      requestBody:
        required: false
        description: |
          推荐的参数传递方式。两个字段也可分别从查询串提供，但每个字段在查询串与正文合计必须恰好出现一次。
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                add_hide_my_eamil:
                  type: string
                  format: email
                  description: 待登记的、已经由 Apple/iCloud 创建并启用的隐私邮箱。
                icloud:
                  type: string
                  format: email
                  description: 已在管理端登记的所属 iCloud 主号邮箱。
            example:
              add_hide_my_eamil: alias@icloud.com
              icloud: primary@icloud.com
      responses:
        "201":
          description: 隐私邮箱登记成功，并生成邮件 API Key 与派生直达链接
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAliasResponse"
              example:
                data:
                  alias: alias@icloud.com
                  icloud: primary@icloud.com
                  api_key: icm_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  mail_api_direct_link: /api/v1/mail/recent?api_key=icm_BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBA
        "400":
          $ref: "#/components/responses/CreateAliasBadRequest"
        "401":
          $ref: "#/components/responses/CreateAliasUnauthorized"
        "404":
          $ref: "#/components/responses/CreateAliasAccountNotFound"
        "409":
          $ref: "#/components/responses/CreateAliasConflict"
        "413":
          $ref: "#/components/responses/CreateAliasRequestTooLarge"
        "415":
          $ref: "#/components/responses/CreateAliasUnsupportedMediaType"
        "429":
          $ref: "#/components/responses/CreateAliasRateLimited"
        "500":
          $ref: "#/components/responses/CreateAliasInternalError"
        "503":
          $ref: "#/components/responses/CreateAliasUnavailable"

  /api/v1/mail/latest:
    get:
      tags:
        - Mail
      operationId: getLatestMail
      summary: 可重复获取当前隐私邮箱的最新一封邮件
      description: |
        使用隐私邮箱自己的 API Key 鉴权。Key 只会解析到它绑定的隐私邮箱，
        因此响应不会包含同一主号下其他隐私邮箱的邮件。

        隐私邮箱的同步状态语义如下：
        - `pending`：新建、重新启用、配置重置后尚待主号级未读同步，或仍在分批追平；
        - `error`：最近一次主号级未读同步失败；
        - `ok`：最近一次主号级未读同步已追平，可以按 PostgreSQL 当前快照作答；该状态不表示逐个扫描过隐私邮箱的全部 IMAP 历史。

        只有状态为 `ok`、`last_synced_at` 存在、没有晚于当前时间且距今不超过三倍轮询周期时，
        才继续判断最新邮件快照。快照存在时返回 200，不额外限制邮件年龄；快照不存在时返回 404；
        其他同步状态返回 503。

        本接口不检查或写入一次性消费状态，不创建 IMAP `\Seen` 任务。重复请求同一个
        `message.id` 仍可返回 200；即使同一 UID 已通过 `/api/v1/mail/recent` 消费，
        本接口仍按上述快照与同步状态规则返回它。

        成功响应保留完整邮件结构，所有时间字段统一使用 RFC 3339/UTC，不受服务端 `TZ` 影响。
      security:
        - aliasApiKey: []
      responses:
        "200":
          description: 当前隐私邮箱同步结果仍新鲜，且存在已保存的最新邮件快照；同一快照可重复读取且不触发消费或 `\Seen`
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestMailResponse"
              examples:
                latestMail:
                  summary: 最新邮件
                  value:
                    data:
                      alias: orders@example.icloud.com
                      message:
                        id: 9283641-1842
                        message_id: "<message-1842@example.com>"
                        received_at: "2026-08-06T12:30:45Z"
                        sent_at: "2026-08-06T12:30:12Z"
                        from:
                          - name: Example Store
                            email: notice@example.com
                        to:
                          - email: orders@example.icloud.com
                        cc: []
                        subject: 订单已确认
                        text: 您的订单已确认。
                        html: "<p>您的订单已确认。</p>"
                        attachments: []
                        has_attachments: false
                        body_truncated: false
                      synced_at: "2026-08-06T12:31:00Z"
                      stale: false
        "401":
          description: Authorization 缺失、格式错误、Key 无效，或绑定的隐私邮箱/主号已停用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_API_KEY
                  message: API Key 无效
                  request_id: 6oe7j0x3x3pJv9Dv
        "404":
          description: 当前隐私邮箱同步结果仍新鲜，但没有邮件快照
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: MAIL_NOT_FOUND
                  message: 尚未收到邮件
                  request_id: 6oe7j0x3x3pJv9Dv
        "429":
          description: 此隐私邮箱 API Key 在当前限流窗口内请求过多
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: RATE_LIMITED
                  message: 请求过于频繁
                  request_id: 6oe7j0x3x3pJv9Dv
        "503":
          description: |
            当前隐私邮箱状态不是 ok、从未完成同步、最后同步时间晚于当前时间，
            或最后同步时间已超过三倍轮询周期时返回 SYNC_UNAVAILABLE；
            查询 Key 或最新邮件快照时数据库暂不可用则返回 DATABASE_UNAVAILABLE。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                syncUnavailable:
                  summary: 隐私邮箱同步状态不可用
                  value:
                    error:
                      code: SYNC_UNAVAILABLE
                      message: 邮箱同步暂不可用
                      request_id: 6oe7j0x3x3pJv9Dv
                databaseUnavailable:
                  summary: 数据库查询暂不可用
                  value:
                    error:
                      code: DATABASE_UNAVAILABLE
                      message: 数据库暂不可用
                      request_id: 6oe7j0x3x3pJv9Dv

  /api/v1/mail/recent:
    get:
      tags:
        - Mail
      operationId: getRecentMail
      summary: 通过可直接访问的链接一次性消费最近一小时内的最新邮件
      description: |
        使用必填且只能出现一次的查询参数 `api_key` 鉴权；Bearer Header 不能替代该查询参数。
        查询参数既接受隐私邮箱的原始 API Key，也接受管理端操作列复制的派生直达凭据。
        两种凭据都只解析到它绑定的唯一隐私邮箱；接口不接受邮箱地址参数，也不会返回同一主号下其他隐私邮箱的邮件。
        派生直达凭据不能用于 `/api/v1/mail/latest` 的 Bearer 鉴权，并会在隐私邮箱 API Key 轮换后失效。

        只有该隐私邮箱状态为 `ok`、`last_synced_at` 存在、没有晚于当前时间且距今不超过三倍轮询周期，
        当前最新邮件快照的 IMAP INTERNALDATE 位于最近一小时内，并且该隐私邮箱从未消费当前
        `UIDVALIDITY + UID` 时才返回 200。接口只检查当前最新快照，不会回退到次新邮件。

        返回 200 前，服务会在同一个 PostgreSQL 事务中原子确认当前快照、记录该 UID 已消费，
        并写入持久化的 IMAP `\Seen` 队列。对同一 UID 的并发请求中只有一个请求会成功；消费成功后，
        同一 UID 的后续请求返回 404 `MAIL_NOT_FOUND`，直到同步到未消费的新 UID。服务按隐私邮箱保留
        已消费 `(UIDVALIDITY, UID)` 的严格历史；数据库快照再次指向已消费 UID 时仍返回 404，
        `UIDVALIDITY` 则隔离不同邮箱代际的相同 UID。iCloud 删除当前邮件不会触发历史扫描或次新邮件回退。
        没有快照、快照在消费事务提交前发生变化、
        最新邮件的 IMAP INTERNALDATE 缺失、为未来时间、不在最近一小时或已经消费时均返回 404；
        同步状态不可用时返回 503。

        `\Seen` 写回由后台按主号异步执行，不阻塞本接口。iCloud 已读状态可能短暂延迟；IMAP 操作失败时
        持久任务会等待重试，已提交的消费不会回滚。`\Seen` 是主号 `INBOX` 中该邮件的全局状态，
        Apple Mail、iCloud Mail 和其他 IMAP 客户端也会看到该邮件变为已读。

        成功响应是仅包含 `data` 的顶层 JSON 对象；`data` 仅包含 `address`、`subject`、`snippet`
        和 `sent_at`。`sent_at` 优先使用邮件 Date 头，缺失或无效时回退到 IMAP 收件时间，
        并按服务端 `TZ` 对应时区输出 RFC 3339；例如 `TZ=Asia/Shanghai` 时包含 `+08:00` 偏移。
        `snippet` 是单行纯文本，优先使用邮件声明的纯文本正文；纯文本为空时从 HTML 正文中
        提取可读文字，并过滤结构标签、样式、脚本及常见的内联隐藏内容。两种来源中的换行、
        制表符和连续空白都会压缩成一个普通空格。
        只有收件时间处于 `[当前时间-1小时, 当前时间]` 区间的快照才会返回；时区转换只影响显示，
        不改变最近一小时的绝对时间窗口。

        消费事务在响应写出前提交，因此客户端超时、断线或未收到 200 时，邮件仍可能已经消费，
        重试将得到 404；需要可恢复或可重复读取时应使用 `/api/v1/mail/latest`。

        注意：这是具有一次性消费和异步已读副作用的 `GET`。浏览器预取、链接预览和安全扫描器
        可能在实际访客之前访问并消费邮件，不要把直达链接交给会自动访问 URL 的系统。查询参数中的
        Key 会出现在浏览器历史中，并可能被反向代理或外围监控记录、通过 Referer 泄露。本应用内置
        HTTP 日志只记录 URL 路径，不记录查询字符串，但不能代替外围系统的脱敏配置。完整 URL 必须
        按密钥保护，只能通过 HTTPS 使用，并应在代理层删除或脱敏查询字符串日志。能设置请求头的
        客户端应优先使用可重复读取且不触发消费的 `/api/v1/mail/latest`；怀疑链接泄露后应立即轮换 Key。
      security:
        - aliasApiKeyQuery: []
      responses:
        "200":
          description: 当前隐私邮箱同步结果仍新鲜，当前最新邮件位于最近一小时内且从未消费；响应前已原子记录消费并持久化 `\Seen` 任务
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentMailResponse"
              example:
                data:
                  address: user@icloud.com
                  subject: Your ChatGPT verification code
                  snippet: Your code is 123456
                  sent_at: "2026-08-07T12:30:00+08:00"
        "401":
          description: api_key 查询参数缺失、格式错误、凭据无效，或绑定的隐私邮箱/主号已停用
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID_API_KEY
                  message: API Key 无效
                  request_id: 6oe7j0x3x3pJv9Dv
        "404":
          description: 当前隐私邮箱同步结果仍新鲜，但没有邮件快照、快照在消费前变化、当前最新邮件不在 [当前时间-1小时, 当前时间] 区间内，或该 (UIDVALIDITY, UID) 已在消费历史中；这些情况均返回 MAIL_NOT_FOUND
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: MAIL_NOT_FOUND
                  message: 最近一小时内没有邮件
                  request_id: 6oe7j0x3x3pJv9Dv
        "429":
          description: 此隐私邮箱 API Key 在当前限流窗口内请求过多
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: RATE_LIMITED
                  message: 请求过于频繁
                  request_id: 6oe7j0x3x3pJv9Dv
        "503":
          description: |
            当前隐私邮箱状态不是 ok、从未完成同步、最后同步时间晚于当前时间，
            或最后同步时间已超过三倍轮询周期时返回 SYNC_UNAVAILABLE；
            查询 Key 或最新邮件快照、原子记录消费或持久化 `\Seen` 任务时数据库暂不可用，
            则返回 DATABASE_UNAVAILABLE；消费记录与 `\Seen` 任务在同一事务中一起提交或一起回滚。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                syncUnavailable:
