  /admin/api/v1/accounts/{id}/sync:
    post:
      tags:
        - Admin Accounts
      operationId: syncAdminAccount
      summary: 立即同步主号邮件
      description: |
        使用该主号的一条 IMAP 连接执行一个有界未读同步批次，并把邮件快照写入 PostgreSQL。
        所有路径都按主号级游标只处理 `UNSEEN`，每批最多提交 256 封；已读 UID 只用于推进游标，
        不进入邮件头或正文读取。首次同步、游标重置或 UIDVALIDITY 变化时，先用少量 sequence UID 查询
        确定最近最多 1024 封邮件的窗口边界并提交该边界，后续批次再只处理窗口内的 `UNSEEN`。
        确定边界不会读取邮件头或正文，也不会读取、校验或恢复每个隐私邮箱的历史 IMAP 快照。
        因此部署时不要让其他客户端或外部流程在本服务同步前标记邮件已读。邮件头和正文通过
        `BODY.PEEK` 读取，本操作本身不会改变 `\Seen`。隐私邮箱不会分别连接 iCloud，本接口也不等待
        或执行直达消费产生的异步 `\Seen` 队列。

        较小的 UID 数值区间使用有界 `UID SEARCH ... UNSEEN`；较大或稀疏的区间先用少量
        sequence `FETCH UID` 探测定位起点，再用一次最多返回 257 条的 `FETCH (UID FLAGS)`
        检查窗口。后续邮件头和正文始终只处理其中最早的最多 256 封未读邮件，成功提交游标后
        再继续下一批。

        请求会把主号加入去重的后台同步队列并立即返回 202；同一主号已有手动任务时重复请求会合并。
        后台任务先等待取得该主号的账号同步锁和全局 IMAP 连接额度，随后才开始计算整轮同步预算。
        `ICLOUD_API_SYNC_TIMEOUT` 默认 `10m`，这 10 分钟全部用于实际数据库读取、IMAP 收取和事务提交；
        排队等待不占用该预算。每条正文 FETCH 最多处理 8 封邮件；只读同步遇到连接关闭时会新建连接重试一次。
        每条 IMAP 网络命令仍分别受默认 `25s` 的 `ICLOUD_API_IMAP_TIMEOUT` 限制。积压批次会在后台连续处理，
        客户端可通过主号详情接口轮询最终状态。
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/AdminAccountID"
        - $ref: "#/components/parameters/AdminCSRFToken"
      responses:
        "200":
          description: 本轮同步成功，主号邮件已经追平；sync_pending 字段省略
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDetailResponse"
        "202":
          description: 手动邮件同步已进入后台队列，或同一主号已有任务正在处理
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/AdminNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDetailResponse"
              example:
                data:
                  account:
                    id: 12
                    name: 主账号
                    email: owner@icloud.com
                    imap_host: imap.mail.me.com
                    imap_port: 993
                    imap_username: owner@icloud.com
                    enabled: true
                    last_sync_status: pending
