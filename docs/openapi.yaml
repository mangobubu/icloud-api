      summary: 为主号建立 Apple 受信任 Web 会话
      description: |
        使用 Apple ID、Apple 账户密码和所选服务区域发起登录。Apple 账户密码只在本次请求中
        用于建立 Web 会话，不写入数据库，也不用于 IMAP 收件。若 Apple 要求双重认证，返回
        `202 verification_required` 和短期有效的 `challenge_id`；否则返回 `200 authenticated`。

        `region=global` 使用全球 iCloud 服务，`region=cn` 使用中国大陆 iCloud 服务。
        请求必须携带有效的后台会话 Cookie、当前后台会话的 `X-CSRF-Token`，并通过同源校验。
