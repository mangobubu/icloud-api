<!doctype html>
<html lang="zh-CN">
<head>{{template "head" .}}</head>
<body>
<div class="app-shell">
  {{template "sidebar" .}}
  <main class="main-area">
    {{template "topbar" .}}
    <div class="content content-narrow">
      {{template "flash" .}}
      <section class="section-block">
        <div class="section-toolbar"><div><h2>修改管理员密码</h2><p>修改后全部后台会话都会失效，需要重新登录。</p></div></div>
        <form method="post" action="/admin/security/password" class="panel stack-form">
          <input type="hidden" name="csrf_token" value="{{.CSRF}}">
          <label class="field"><span>当前密码</span><input type="password" name="current_password" required autocomplete="current-password"></label>
          <label class="field"><span>新密码</span><input type="password" name="new_password" required minlength="12" maxlength="72" autocomplete="new-password"><small>长度为 12 到 72 字节。</small></label>
          <label class="field"><span>确认新密码</span><input type="password" name="confirm_password" required minlength="12" maxlength="72" autocomplete="new-password"></label>
          <div class="form-actions"><button class="button button-primary" type="submit">更新密码</button></div>
        </form>
      </section>
    </div>
  </main>
</div>
</body>
</html>
