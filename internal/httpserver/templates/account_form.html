<!doctype html>
<html lang="zh-CN">
<head>{{template "head" .}}</head>
<body>
<div class="app-shell">
  {{template "sidebar" .}}
  <main class="main-area">
    {{template "topbar" .}}
    <div class="content content-narrow">
      {{template "flash" .}}
      <form method="post" action="{{.FormAction}}" class="panel stack-form">
        <input type="hidden" name="csrf_token" value="{{.CSRF}}">
        <div class="form-grid">
          <label class="field"><span>备注</span><input name="name" maxlength="80" value="{{.Account.Name}}" placeholder="例如：个人主号"></label>
          <label class="field"><span>iCloud 主号邮箱</span><input type="email" name="email" required value="{{.Account.Email}}" placeholder="name@icloud.com" {{if and .IsEdit (gt .Account.AliasCount 0)}}readonly{{end}}></label>
          <label class="field"><span>IMAP 用户名</span><input name="imap_username" required value="{{.Account.IMAPUsername}}" autocomplete="username" placeholder="通常填写完整 iCloud 邮箱" {{if and .IsEdit (gt .Account.AliasCount 0)}}readonly{{end}}>{{if and .IsEdit (gt .Account.AliasCount 0)}}<small>已有隐私邮箱后主号身份保持固定。</small>{{end}}</label>
          <label class="field"><span>IMAP 服务</span><input value="imap.mail.me.com:993（TLS）" readonly aria-readonly="true"></label>
          <label class="field field-span"><span>App 专用密码</span><input type="password" name="imap_password" {{if not .IsEdit}}required{{end}} autocomplete="new-password" placeholder="{{if .IsEdit}}留空则不修改{{else}}在 Apple 账户中生成的专用密码{{end}}"><small>专用密码只会加密保存，后续不会回显。</small></label>
          {{if .IsEdit}}<label class="check-field field-span"><input type="checkbox" name="enabled" value="1" {{if .Account.Enabled}}checked{{end}}><span>启用这个主号的同步</span></label>{{end}}
        </div>
        <div class="form-actions"><a class="button" href="{{if .IsEdit}}/admin/accounts/{{.Account.ID}}{{else}}/admin{{end}}">取消</a><button class="button button-primary" type="submit">保存</button></div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
